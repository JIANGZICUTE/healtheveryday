<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef6f0">
  <title>修复旧缓存 · 量子冰淇淋</title>
</head>
<body style="margin:0;min-height:100vh;display:grid;place-items:center;background:#eef6f0;color:#173a34;font-family:'Microsoft YaHei',sans-serif">
  <main style="width:min(90vw,420px);padding:32px;border-radius:24px;background:#fff;box-shadow:0 18px 50px rgba(23,58,52,.14);text-align:center">
    <h1 style="margin:0 0 12px;font-size:1.5rem">正在修复旧缓存</h1>
    <p id="status" style="margin:0;line-height:1.7;color:#55706a">清理 Service Worker 和旧网页缓存，不会删除你的记录。</p>
  </main>
  <script>
    (async () => {
      const status = document.querySelector('#status');
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(registration => registration.unregister()));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(key => caches.delete(key)));
        }
        status.textContent = '修复完成，正在重新打开网站…';
        setTimeout(() => window.location.replace('/?v=17'), 700);
      } catch (error) {
        status.textContent = `修复失败：${error.message}`;
      }
    })();
  </script>
</body>
</html>
