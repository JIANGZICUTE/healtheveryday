<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef6f0">
  <title>登录 · 量子冰淇淋</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="login-shell">
    <section class="login-card" aria-labelledby="login-heading">
      <div class="login-mark" aria-hidden="true">量</div>
      <p class="login-kicker">量子冰淇淋 · 每日营养图谱</p>
      <h1 id="login-heading">进入你的私人记录</h1>
      <p class="login-intro">电脑和手机输入同一密码。登录后，饮食、训练、体重、自定义食物、昵称和头像会自动同步。</p>
      <form id="login-form">
        <label for="password">网站密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" minlength="8" required autofocus>
        <p class="login-error" id="login-error" role="alert" hidden></p>
        <button type="submit" id="login-submit">登录并同步</button>
      </form>
      <p class="login-footnote">密码保存在 Cloudflare 加密环境变量中，不会写入网页代码。</p>
    </section>
  </main>
  <script type="module" src="login.js"></script>
</body>
</html>
